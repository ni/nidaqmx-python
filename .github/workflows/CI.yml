name: CI

on:
  push:
    branches:
      - master
      - 'releases/**'
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
  check_api_compatibility:
    name: Check API compatibility
    needs: [build]
    uses: ./.github/workflows/check_api_compatibility.yml
    permissions:
      contents: read
    with:
      base: >-
        ${{ case(
          github.event_name == 'pull_request' && startsWith(github.base_ref, 'releases/'), github.event.pull_request.base.sha,
          github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000', github.event.before,
          ''
        ) }}
  run_unit_tests:
    name: Run unit tests
    uses: ./.github/workflows/run_unit_tests.yml
    needs: [build]
  generate_docs:
    name: Generate docs
    uses: ./.github/workflows/generate_docs.yml
    needs: [build]
  check_workflows:
    name: Check workflows
    uses: ./.github/workflows/check_workflows.yml
    permissions:
      security-events: write
  run_system_tests:
    name: Run system tests
    uses: ./.github/workflows/run_system_tests.yml
    needs: [build, run_unit_tests]
  report_test_results:
    name: Report test results
    uses: ./.github/workflows/report_test_results.yml
    needs: [run_unit_tests, run_system_tests]
    if: always()
    permissions:
      contents: read
      checks: write
      pull-requests: write
