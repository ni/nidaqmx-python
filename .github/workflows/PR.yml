name: PR

on:
  pull_request:
    branches:
      - master
      - 'releases/**'
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  run_ci:
    name: Run CI
    uses: ./.github/workflows/CI.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write